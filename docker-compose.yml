# docker-compose.yml
services:
  redis:
    image: redis:7-alpine
    container_name: kr2-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is not set}"]
    env_file:
      - .env
    volumes:
      - redis_data:/data
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    image: kr2-app:1.0
    container_name: kr2-app
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - PORT=8001
    ports:
      - "127.0.0.1:8001:8001"
    networks:
      - backend
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

networks:
  backend:
    driver: bridge

volumes:
  redis_data: